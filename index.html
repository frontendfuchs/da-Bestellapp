<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
  </head>
  <body>
    <header>
      <div class="header-top">
        <img
          src="./assets/icons/menu-icon-white.png"
          alt="icon of pape bag and fork"
        />
        <p>
          Bestell <br />
          <span>App</span>
        </p>
      </div>
    </header>
    <main class="main-content">
        <div class="content">
            <section class="hero-section">
                <img src="./assets/img/header-image.jpg" alt="pizza on a table"/>
            </section>
            <section class="intro-section">
                <img src="./assets/icons/main-icon.png" alt="burger icon"/>
            </section>
            <div class="rating-box">
                <img src="./assets/icons/rating-icon.png" alt="rating box with 4,1 stars, reviewd from 317 individuals">
            </div>
            <div class="intro-text">
                <h1>BurgerHouse</h1>
                <p>The best of Burgers, Pizza, and Greens, all in one great place</p>
            </div>
        </div>
        <section id="menu-list"></section>
    </main>
  </body>
</html>
