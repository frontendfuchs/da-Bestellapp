<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/icons/menu-icon-white.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body onload="render()">
    <header class="header-section">
  <div class="content header-inner">
    <div class="header-top-left">
      <img
        src="./assets/icons/Logo-header.png"
        alt="icon of paper bag and fork"
      />
    </div>

    <div class="header-top-right">
      <img
        src="./assets/icons/dehaze.png"
        alt="menu icon"
      />
    </div>
  </div>
</header>
    <main class="main-content">
      <section class="hero-section">
        <img
          class="hero-img"
          src="./assets/img/header-image.jpg"
          alt="pizza on a table"
        />
        <img
          class="hero-icon"
          src="./assets/icons/main-icon.png"
          alt="burger icon"
        />
      </section>
      <div class="content">
        <div class="rating-box-wrapper">
          <div class="rating-box">
            <img src="./assets/icons/star.png" alt="star for rating box " />
            <p class="rating"><strong>4,1</strong></p>
            <p class="rewiev">(317)</p>
          </div>
        </div>
        <div class="intro-text">
          <h1><span class="burger">Burger</span><span>House</span></h1>
          <p>The best of Burgers, Pizza, and Greens, all in one great place</p>
        </div>
      </div>
      <section id="menu-list"></section>

      <nav class="bottom-navigation">
        <ul class="bottom-nav-list">
          <li>
            <a href=""
              ><img
                src="./assets/icons/home-icon-white.png"
                alt="home icon navigation"
            /></a>
          </li>
          <li>
            <a href=""
              ><img
                src="./assets/icons/person-icon-white.png"
                alt="profile icon navigation"
            /></a>
          </li>
          <li>
            <a href=""
              ><img
                src="./assets/icons/menu-icon-white.png"
                alt="order icon navigation"
            /></a>
          </li>
          <li>
            <button onclick="toggleBasket()">
              <img
                src="./assets/icons/shopping-cart-icon-white.png"
                alt="basket icon navigation"
              />
            </button>
            <div id="basket-count-id" class="basket-count"></div>
          </li>
        </ul>
      </nav>
      <aside id="toggleBasket" class="basket-modal">
        <div class="basket-limit">
          <div class="basket-content">
            <div id="myBasket" class="d-none"></div>
          </div>
        </div>
      </aside>
    </main>

    <dialog id="confirmationDialog">
      <div class="confirmationDialog-wrapper">
        <div class="dialog-top">
          <button onclick="closeConfirmationDialog()">✕</button>
        </div>
        <div>
          <img src="./assets/icons/delivery-truck-icon.png" />
          <h2>Order confirmed!</h2>
          <p>Your food is on the way!</p>
        </div>
      </div>
    </dialog>

    <footer>
      <div class="footer-section">
        <p>Imprint</p>
        <p>Cookie Preferences</p>
        <p><strong>©</strong> 2026 BurgerHouse</p>
      </div>
    </footer>
  </body>
</html>
